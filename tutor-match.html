<script>
"use strict";
/* ==========================================================================
   1. TIMEZONE CORE  — pure functions, no DOM, no globals beyond constants.
   Tutors live in US Pacific (DST). Students live in Beijing (UTC+8, no DST).
   ========================================================================== */
const MIN = 60000, HOUR = 3600000, DAY = 86400000;
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYS = ['fri','sat','sun'];            // weekend blocks we accept
const DAY_OFF = {fri:-1, sat:0, sun:1};      // days from the reference Saturday

// nth occurrence of `weekday` in a month, as UTC midnight ms.
function nthWeekdayUTC(year, monthIdx, weekday, n){
  const first = Date.UTC(year, monthIdx, 1);
  const firstWd = new Date(first).getUTCDay();
  return Date.UTC(year, monthIdx, 1 + ((weekday - firstWd + 7) % 7) + (n - 1) * 7);
}
// US DST begins 2nd Sunday of March at 02:00 local standard time = 10:00 UTC (Pacific).
const dstStartUTC = y => nthWeekdayUTC(y, 2, 0, 2) + 10 * HOUR;
// US DST ends 1st Sunday of November at 02:00 local daylight time = 09:00 UTC (Pacific).
const dstEndUTC   = y => nthWeekdayUTC(y, 10, 0, 1) + 9 * HOUR;

function pacificOffsetMin(utcMs){
  const y = new Date(utcMs).getUTCFullYear();
  return (utcMs >= dstStartUTC(y) && utcMs < dstEndUTC(y)) ? -420 : -480;
}
const ZONES = {
  PT: {name:'Pacific', std:-480, alt:-420, offsetAt:pacificOffsetMin,
       abbr:m => pacificOffsetMin(m) === -420 ? 'PDT' : 'PST'},
  CN: {name:'Beijing', std:480,  alt:480,  offsetAt:() => 480, abbr:() => 'CST'}
};

/* Convert a wall-clock instant (expressed as if the local fields were UTC) into
   a true UTC instant for `zone`.
   Conventions at transitions:
     - spring-forward gap  (02:00–02:59 does not exist): shifted forward one hour
     - fall-back ambiguity (01:00–01:59 happens twice):  first (daylight) occurrence */
function wallToUtc(wallMs, zone){
  const z = ZONES[zone];
  if (z.std === z.alt) return wallMs - z.std * MIN;
  const Us = wallMs - z.std * MIN;            // candidate assuming standard time
  const Ua = wallMs - z.alt * MIN;            // candidate assuming daylight time (earlier)
  const o1 = z.offsetAt(Us), o2 = z.offsetAt(Ua);
  if (o1 === o2) return wallMs - o1 * MIN;                 // unambiguous
  if (o1 === z.std && o2 === z.alt) return Ua;             // ambiguous → first occurrence
  return Us;                                               // nonexistent → shift forward
}
function utcToWall(utcMs, zone){
  const off = ZONES[zone].offsetAt(utcMs);
  const d = new Date(utcMs + off * MIN);
  return {wd:d.getUTCDay(), h:d.getUTCHours(), m:d.getUTCMinutes(),
          abbr:ZONES[zone].abbr(utcMs), off};
}
const pad = n => String(n).padStart(2,'0');
const hm  = w => pad(w.h) + ':' + pad(w.m);
const fmtAt = (utcMs, zone) => { const w = utcToWall(utcMs, zone); return WD[w.wd] + ' ' + hm(w); };
function fmtRange(iv, zone){
  const a = utcToWall(iv.s, zone), b = utcToWall(iv.e, zone);
  return WD[a.wd] + ' ' + hm(a) + '–' + (b.wd !== a.wd ? WD[b.wd] + ' ' : '') + hm(b);
}

/* ==========================================================================
   2. AVAILABILITY & OVERLAP  — pure
   A block is {day:'fri'|'sat'|'sun', start:minutes, end:minutes} in its own zone.
   weekSatMs is UTC-midnight of the reference Saturday.
   ========================================================================== */
function blockToInterval(block, zone, weekSatMs){
  const base = weekSatMs + DAY_OFF[block.day] * DAY;
  return {s:wallToUtc(base + block.start * MIN, zone),
          e:wallToUtc(base + block.end   * MIN, zone), day:block.day};
}
function intersect(a, b){
  const s = Math.max(a.s, b.s), e = Math.min(a.e, b.e);
  return e > s ? {s, e} : null;             // touching endpoints are NOT an overlap
}
function mergeIntervals(list){
  const xs = list.slice().sort((a,b) => a.s - b.s), out = [];
  for (const iv of xs){
    const last = out[out.length - 1];
    if (last && iv.s <= last.e) last.e = Math.max(last.e, iv.e);
    else out.push({s:iv.s, e:iv.e});
  }
  return out;
}
/** Genuine overlap between Pacific tutor blocks and Beijing student blocks. */
function computeOverlaps(tutorBlocks, studentBlocks, weekSatMs){
  const T = tutorBlocks.map(b => blockToInterval(b, 'PT', weekSatMs));
  const S = studentBlocks.map(b => blockToInterval(b, 'CN', weekSatMs));
  const hits = [];
  for (const t of T) for (const s of S){ const x = intersect(t, s); if (x) hits.push(x); }
  return mergeIntervals(hits);
}
const totalMin = ivs => ivs.reduce((a, iv) => a + (iv.e - iv.s) / MIN, 0);
const hrs = m => (m / 60).toFixed(1).replace(/\.0$/, '');

/* An overlap shown in both zones at once, weekday labelled per side. */
function bothZones(iv){
  return fmtRange(iv,'CN') + ' Beijing  ·  ' + fmtRange(iv,'PT') + ' ' + utcToWall(iv.s,'PT').abbr;
}
/* Flag hours that are unpleasant on either end. */
function awkwardHours(ivs){
  const notes = [];
  for (const iv of ivs){
    const p = utcToWall(iv.s,'PT'), pe = utcToWall(iv.e,'PT');
    const c = utcToWall(iv.s,'CN'), ce = utcToWall(iv.e,'CN');
    if (p.h < 7) notes.push('starts ' + hm(p) + ' Pacific — very early for the tutor');
    else if (pe.h >= 22 || (pe.h === 0 && pe.m > 0)) notes.push('runs to ' + hm(pe) + ' Pacific — late for the tutor');
    if (c.h < 7) notes.push('starts ' + hm(c) + ' Beijing — very early for the student');
    else if (ce.h >= 22 || (ce.h === 0 && ce.m > 0)) notes.push('runs to ' + hm(ce) + ' Beijing — late for the student');
  }
  return [...new Set(notes)];
}

/* ==========================================================================
   3. MATCHING  — pure given (tutor, student, ctx)
   ========================================================================== */
const LEVELS = ['beginner','intermediate','advanced'];
const FOCUS  = ['conversation','reading','writing','test prep','pronunciation','vocabulary','presentation'];
const li = l => LEVELS.indexOf(l);

function buildCtx(state){
  const load = {};
  for (const t of state.tutors) load[t.id] = t.priorLoad;
  for (const s of state.students) if (s.tutorId && load[s.tutorId] !== undefined) load[s.tutorId]++;
  return {load, weekSatMs:weekMs(state.weekSat)};
}

/** Returns a full evaluation: score breakdown, blockers, reasons, weaknesses. */
function evaluate(tutor, student, ctx){
  const load = ctx.load[tutor.id] ?? 0;
  const remaining = tutor.maxStudents - load;
  const ov = computeOverlaps(tutor.avail, student.avail, ctx.weekSatMs);
  const mins = totalMin(ov);
  const inLevel = li(student.level) >= li(tutor.levelMin) && li(student.level) <= li(tutor.levelMax);
  const shFocus = tutor.focus.filter(f => student.goals.includes(f));
  const shInt   = tutor.interests.filter(i => student.interests.includes(i));

  const blockers = [];
  if (mins === 0)     blockers.push('schedule');
  if (remaining <= 0) blockers.push('capacity');
  if (!inLevel)       blockers.push('level');

  const width = li(tutor.levelMax) - li(tutor.levelMin) + 1;
  const parts = {
    schedule:  35 * Math.min(1, mins / 180),
    subject:   25 * Math.min(1, shFocus.length / Math.max(1, Math.min(tutor.focus.length, student.goals.length))),
    level:     inLevel ? 14 + 6 * (1 - (width - 1) / 2) : 0,
    interests: 10 * Math.min(1, shInt.length / 2),
    capacity:  remaining > 0 ? 10 * (1 - load / Math.max(1, tutor.maxStudents)) : 0
  };
  const score = Math.round(Object.values(parts).reduce((a,b) => a + b, 0));

  // ---- plain-English reasoning ----
  const why = [], weak = [];
  if (mins > 0){
    why.push(hrs(mins) + ' h of overlap across ' + ov.length + ' block' + (ov.length > 1 ? 's' : '') +
             ': ' + ov.slice(0,2).map(bothZones).join(' | ') + (ov.length > 2 ? ' (+' + (ov.length-2) + ' more)' : ''));
  }
  if (shFocus.length) why.push('Both listed: ' + shFocus.join(', '));
  if (inLevel) why.push('Student is ' + student.level + '; tutor covers ' +
             (tutor.levelMin === tutor.levelMax ? tutor.levelMin + ' only' : tutor.levelMin + '–' + tutor.levelMax) +
             (width === 1 ? ' (specialist)' : ''));
  if (shInt.length) why.push('Shared interests: ' + shInt.join(', '));
  if (remaining > 0) why.push('Tutor has ' + remaining + ' of ' + tutor.maxStudents + ' slot' +
             (tutor.maxStudents > 1 ? 's' : '') + ' open' + (load ? ' (' + load + ' already assigned)' : ''));

  if (mins === 0) weak.push('No overlapping time at all — cannot be paired.');
  else {
    if (ov.length === 1) weak.push('Only one shared time block — fragile if either side cancels.');
    if (mins < 90) weak.push('Under 1.5 h of overlap per week.');
    awkwardHours(ov).forEach(n => weak.push('Overlap ' + n + '.'));
  }
  if (!shFocus.length) weak.push('No overlap between tutor focus areas and student goals.');
  if (!shInt.length)   weak.push('No shared outside interests listed.');
  if (!inLevel) weak.push('Level mismatch: student is ' + student.level + ', tutor covers ' +
             tutor.levelMin + '–' + tutor.levelMax + '.');
  if (remaining === 1) weak.push("This is the tutor's last open slot.");
  if (remaining <= 0)  weak.push('Tutor is at capacity (' + load + '/' + tutor.maxStudents + ').');

  return {tutor, student, score, parts, ov, mins, inLevel, remaining, load,
          shFocus, shInt, blockers, viable:blockers.length === 0,
          marginal:blockers.length === 1 && blockers[0] === 'level', why, weak};
}

/** Ranked candidates for one student. `marginal` includes level-mismatched tutors. */
function rank(student, state, ctx, marginal){
  const evals = state.tutors.map(t => evaluate(t, student, ctx));
  const keep = evals.filter(e => e.viable || (marginal && e.marginal));
  keep.sort((a,b) => b.score - a.score || a.tutor.name.localeCompare(b.tutor.name));
  return {all:evals, top:keep};
}

/** Why does this student have nothing? Reports the first gate that everyone fails. */
function blockReason(evals){
  const withOverlap = evals.filter(e => e.mins > 0);
  if (!evals.length) return 'There are no tutors in the roster.';
  if (!withOverlap.length)
    return "No tutor's availability overlaps theirs at all, in either direction across the date line.";
  const levelOk = withOverlap.filter(e => e.inLevel);
  if (!levelOk.length)
    return withOverlap.length + ' tutor(s) overlap on time, but none cover the ' +
           evals[0].student.level + ' level.';
  const free = levelOk.filter(e => e.remaining > 0);
  if (!free.length)
    return levelOk.length + ' tutor(s) fit on time and level, but all of them are at capacity.';
  return 'No blocker found.';
}

/* ==========================================================================
   4. SELF-TESTS
   ========================================================================== */
const TESTS = [];
const test = (name, fn) => TESTS.push({name, fn});
function eq(actual, expected, label){
  const a = JSON.stringify(actual), b = JSON.stringify(expected);
  if (a !== b) throw new Error((label ? label + ': ' : '') + 'expected ' + b + ', got ' + a);
}
const weekMs = iso => Date.parse(iso + 'T00:00:00Z');
const B = (day, start, end) => ({day, start:toMin(start), end:toMin(end)});

test('Pacific is PST (UTC−8) in January', () => eq(pacificOffsetMin(Date.UTC(2026,0,17,20)), -480));
test('Pacific is PDT (UTC−7) in August',  () => eq(pacificOffsetMin(Date.UTC(2026,7,1,20)),  -420));
test('Spring-forward boundary is 2026-03-08 10:00Z', () => {
  eq(pacificOffsetMin(Date.UTC(2026,2,8,9,59)), -480, 'before');
  eq(pacificOffsetMin(Date.UTC(2026,2,8,10,0)), -420, 'after');
});
test('Fall-back boundary is 2026-11-01 09:00Z', () => {
  eq(pacificOffsetMin(Date.UTC(2026,10,1,8,59)), -420, 'before');
  eq(pacificOffsetMin(Date.UTC(2026,10,1,9,0)),  -480, 'after');
});
test('Beijing is UTC+8 year-round (no DST)', () => {
  eq(ZONES.CN.offsetAt(Date.UTC(2026,0,1)), 480);
  eq(ZONES.CN.offsetAt(Date.UTC(2026,6,1)), 480);
});
test('Date line: Beijing Sat 09:00 = Pacific Fri 18:00 in summer (PDT)', () => {
  const iv = blockToInterval(B('sat','09:00','10:00'), 'CN', weekMs('2026-08-01'));
  eq(fmtAt(iv.s,'PT'), 'Fri 18:00');
  eq(fmtAt(iv.s,'CN'), 'Sat 09:00');
});
test('Date line: Beijing Sat 09:00 = Pacific Fri 17:00 in winter (PST)', () => {
  const iv = blockToInterval(B('sat','09:00','10:00'), 'CN', weekMs('2026-01-17'));
  eq(fmtAt(iv.s,'PT'), 'Fri 17:00');
});
test('Overlap across the date line (summer): 3 h', () => {
  const ov = computeOverlaps([B('fri','17:00','20:00')], [B('sat','08:00','11:00')], weekMs('2026-08-01'));
  eq(ov.length, 1); eq(totalMin(ov), 180);
  eq(fmtRange(ov[0],'CN'), 'Sat 08:00–11:00');
  eq(fmtRange(ov[0],'PT'), 'Fri 17:00–20:00');
});
test('The same two blocks lose an hour in winter (PST)', () => {
  const ov = computeOverlaps([B('fri','17:00','20:00')], [B('sat','08:00','11:00')], weekMs('2026-01-17'));
  eq(totalMin(ov), 120, 'winter overlap');
  eq(fmtRange(ov[0],'CN'), 'Sat 09:00–11:00');
});
test('Identical wall-clock weekends do NOT overlap (15 h apart)', () => {
  eq(computeOverlaps([B('sat','09:00','12:00')], [B('sat','09:00','12:00')], weekMs('2026-08-01')), []);
});
test('Touching endpoints are not an overlap', () => {
  // Pacific Sat 18:00–21:00 = Beijing Sun 09:00–12:00; student starts exactly at 12:00.
  eq(computeOverlaps([B('sat','18:00','21:00')], [B('sun','12:00','13:00')], weekMs('2026-08-01')), []);
});
test('Spring-forward: Pacific Sun 01:00–04:00 is only 2 real hours', () => {
  const iv = blockToInterval(B('sun','01:00','04:00'), 'PT', weekMs('2026-03-07'));
  eq((iv.e - iv.s) / MIN, 120);
});
test('Fall-back: Pacific Sun 01:00–04:00 is 4 real hours', () => {
  const iv = blockToInterval(B('sun','01:00','04:00'), 'PT', weekMs('2026-10-31'));
  eq((iv.e - iv.s) / MIN, 240);
});
test('Nonexistent 02:30 PT on spring-forward day shifts to 03:30 PDT', () => {
  const t = wallToUtc(Date.UTC(2026,2,8,2,30), 'PT');
  eq(fmtAt(t,'PT'), 'Sun 03:30');
});
test('Ambiguous 01:30 PT on fall-back day resolves to the first (PDT) pass', () => {
  const t = wallToUtc(Date.UTC(2026,10,1,1,30), 'PT');
  eq(t, Date.UTC(2026,10,1,8,30));
});
test('Beijing Sun evening ↔ Pacific Sun early morning across the fall-back hour', () => {
  const ov = computeOverlaps([B('sun','03:00','05:00')], [B('sun','19:00','21:00')], weekMs('2026-10-31'));
  eq(totalMin(ov), 120);
  eq(fmtRange(ov[0],'PT'), 'Sun 03:00–05:00');
  eq(fmtRange(ov[0],'CN'), 'Sun 19:00–21:00');
});
test('Overlap totals sum across several blocks', () => {
  const ov = computeOverlaps([B('fri','17:00','21:00'), B('sat','17:00','20:00')],
                             [B('sat','08:00','11:00'), B('sun','08:00','10:00')], weekMs('2026-08-01'));
  eq(ov.length, 2); eq(totalMin(ov), 300);
});
test('Merging: adjacent intersections collapse into one', () => {
  eq(mergeIntervals([{s:0,e:100},{s:100,e:200},{s:400,e:500}]), [{s:0,e:200},{s:400,e:500}]);
});
test('Block ends at local midnight (end = 24:00) is handled', () => {
  const iv = blockToInterval(B('sat','22:00','24:00'), 'CN', weekMs('2026-08-01'));
  eq((iv.e - iv.s) / MIN, 120);
  eq(fmtAt(iv.e,'CN'), 'Sun 00:00');
});
test('Zero overlap is a hard gate — never suggested', () => {
  const ctx = {load:{t:0}, weekSatMs:weekMs('2026-08-01')};
  const e = evaluate(TT({avail:[B('sat','09:00','12:00')]}), SS({avail:[B('sat','09:00','12:00')]}), ctx);
  eq(e.viable, false); eq(e.blockers.includes('schedule'), true);
});
test('A tutor at max capacity is gated out', () => {
  const ctx = {load:{t:2}, weekSatMs:weekMs('2026-08-01')};
  const e = evaluate(TT({maxStudents:2}), SS({}), ctx);
  eq(e.viable, false); eq(e.blockers.includes('capacity'), true);
});
test('Level mismatch is gated but flagged as marginal, not merely low-scoring', () => {
  const ctx = {load:{t:0}, weekSatMs:weekMs('2026-08-01')};
  const e = evaluate(TT({levelMin:'beginner', levelMax:'intermediate'}), SS({level:'advanced'}), ctx);

/* ==========================================================================
   5. PARSING HELPERS
   ========================================================================== */
function toMin(s){                       // "17:30" → 1050 ; also accepts "24:00"
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(s).trim());
  return m ? (+m[1]) * 60 + (+m[2]) : 0;
}
const toHM = m => pad(Math.floor(m / 60) % 24) + ':' + pad(m % 60);
const toHMfull = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
function parseAvail(str){                // "fri 17:00-21:00; sat 08:00-10:00"
  return String(str || '').split(/[;\n]/).map(s => s.trim()).filter(Boolean).map(s => {
    const m = /^(fri|sat|sun)\w*\s+(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})$/i.exec(s);
    return m ? {day:m[1].toLowerCase(), start:toMin(m[2]), end:toMin(m[3])} : null;
  }).filter(Boolean);
}
const fmtAvail = a => a.map(b => b.day + ' ' + toHMfull(b.start) + '-' + toHMfull(b.end)).join('; ');
const splitList = s => [...new Set(String(s || '').split(/[;,|]/).map(x => x.trim().toLowerCase()).filter(Boolean))];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let _uid = 0;
const uid = p => p + (++_uid);

function parseCSV(text){
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n'){ row.push(f); f = ''; rows.push(row); row = []; }
    else if (c !== '\r') f += c;
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
const toCSV = rows => rows.map(r => r.map(c => {
  c = String(c ?? ''); return /[",\n]/.test(c) ? '"' + c.replace(/"/g,'""') + '"' : c;
}).join(',')).join('\n');

function nextSaturday(){
  const now = new Date();
  const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
  d.setUTCDate(d.getUTCDate() + ((6 - d.getUTCDay() + 7) % 7));
  return d.toISOString().slice(0,10);
}
function snapToSaturday(iso){            // nearest Saturday; a Friday belongs to the weekend ahead
  const ms = weekMs(iso);
  if (isNaN(ms)) return S.weekSat;
  const d = new Date(ms), wd = d.getUTCDay();
  const back = (wd + 1) % 7, fwd = (6 - wd + 7) % 7;
  d.setUTCDate(d.getUTCDate() + (fwd <= back ? fwd : -back));
  return d.toISOString().slice(0,10);
}

  });

      ' also rank' + (contention > 1 ? '' : 's') + ' this tutor first, but only ' +
      e.remaining + ' slot' + (e.remaining === 1 ? '' : 's') + ' remain' + (e.remaining === 1 ? 's' : '') + '.');

function viewMatching(){
  if (!S.tutors.length && !S.students.length){
    main.innerHTML = `<div class="card"><p>No roster loaded.</p>
      <p class="muted">Click <b>Load sample data</b> above for a demo roster, or import a JSON save file,
      or add records in the Tutors / Students views.</p></div>`;
    return;
  }
  const ctx = buildCtx(S);
  const unassigned = S.students.filter(s => !s.tutorId);
  const ranked = unassigned.map(s => ({student:s, ...rank(s, S, ctx, S.marginal)}));

  // contention: how many students put the same tutor first
  const firstCount = {};
  ranked.forEach(r => { const t = r.top[0]; if (t) firstCount[t.tutor.id] = (firstCount[t.tutor.id] || 0) + 1; });

  // ---------- problems ----------
  const stuck = ranked.filter(r => !r.top.length);
  const openTutors = S.tutors.filter(t => t.maxStudents - ctx.load[t.id] > 0);
  const idleTutors = openTutors.map(t => {
    const evs = unassigned.map(s => evaluate(t, s, ctx));
    return {t, evs, any:evs.some(e => e.viable)};
  }).filter(x => !x.any);
  const broken = S.students.filter(s => s.tutorId).map(s => {
    const t = findT(s.tutorId);
    if (!t) return {s, t:null, msg:'Assigned tutor is no longer in the roster.'};
    const e = evaluate(t, s, ctx);
    if (e.mins === 0) return {s, t, msg:'No overlapping availability any more for the weekend of ' + S.weekSat + '.'};
    if (!e.inLevel) return {s, t, msg:'Student is ' + s.level + ' but tutor now covers ' + t.levelMin + '–' + t.levelMax + '.'};
    return null;
  }).filter(Boolean);
  const healthy = S.students.filter(s => s.tutorId && !broken.some(b => b.s.id === s.id))
    .map(s => ({s, t:findT(s.tutorId), e:evaluate(findT(s.tutorId), s, ctx)}));

  let html = `<div class="hd"><h2>Matching</h2><div>
      <label style="flex-direction:row;align-items:center;gap:5px"><input type="checkbox" id="marg"${S.marginal ? ' checked' : ''}>
        include out-of-level tutors as marginal suggestions</label></div></div>
    <p class="sub">Existing pairings are preserved. Suggestions are proposed only for the
      ${unassigned.length} unassigned student${unassigned.length === 1 ? '' : 's'};
      accepting one updates tutor load and re-ranks everything else.</p>`;

  const probs = stuck.length + idleTutors.length + broken.length;
  html += `<h3>Needs your attention ${probs ? `<span class="pill bad">${probs}</span>` : `<span class="pill ok">none</span>`}</h3>`;
  for (const r of stuck)
    html += `<div class="prob bad"><b>${esc(r.student.name)}</b> (${esc(r.student.level)}, grade ${r.student.grade})
      has no viable tutor. ${esc(blockReason(r.all))}
      <div class="sub">Available ${esc(fmtAvail(r.student.avail))} Beijing
        = ${esc(r.student.avail.map(b => fmtRange(blockToInterval(b,'CN',ctx.weekSatMs),'PT')).join('; '))} Pacific.</div></div>`;
  for (const x of idleTutors)
    html += `<div class="prob"><b>${esc(x.t.name)}</b> has ${x.t.maxStudents - ctx.load[x.t.id]} open slot(s)
      but no viable unassigned student. ${esc(idleReason(x.evs, x.t))}
      <div class="sub">Available ${esc(fmtAvail(x.t.avail))} Pacific
        = ${esc(x.t.avail.map(b => fmtRange(blockToInterval(b,'PT',ctx.weekSatMs),'CN')).join('; '))} Beijing.</div></div>`;
  for (const b of broken)
    html += `<div class="prob bad">Existing pair <b>${esc(b.s.name)}</b> ↔ <b>${b.t ? esc(b.t.name) : '?'}</b> is no longer viable.
      ${esc(b.msg)} <button data-act="unassign" data-s="${b.s.id}">Unassign</button></div>`;
  if (!probs) html += `<p class="muted">No unmatched students, no idle tutors, no broken pairs.</p>`;

  // ---------- suggestions ----------
  html += `<h3>Suggestions for unassigned students</h3>`;
  const withCands = ranked.filter(r => r.top.length);
  html += withCands.length ? withCands.map(r => `<div class="card">
      <div class="hd"><h2>${esc(r.student.name)} <span class="muted">grade ${r.student.grade} ·
        ${esc(r.student.level)} · ${esc(r.student.goals.join(', ') || 'no goals listed')}</span></h2>
        <span class="sub">${r.top.length} viable tutor${r.top.length === 1 ? '' : 's'}</span></div>
      <div class="sub">Free ${esc(fmtAvail(r.student.avail))} Beijing${r.student.notes ? ' · ' + esc(r.student.notes) : ''}</div>
      ${r.top.slice(0,3).map((e, i) => candidateHTML(e, i,
          i === 0 ? (firstCount[e.tutor.id] || 1) - 1 : 0)).join('')}
    </div>`).join('') : `<p class="muted">No unassigned students with viable tutors.</p>`;

  // ---------- current pairings ----------
  html += `<h3>Current pairings (${healthy.length} healthy)</h3>`;
  html += healthy.length ? `<div class="card">` + healthy.map(p => `<div style="padding:4px 0;border-bottom:1px solid var(--line)">
      <b>${esc(p.s.name)}</b> ↔ <b>${esc(p.t.name)}</b>
      <span class="pill ok">${hrs(p.e.mins)} h/wk</span>
      <button data-act="unassign" data-s="${p.s.id}">Unassign</button>
      <div class="sub">${esc(p.e.ov.map(bothZones).join(' | '))}</div></div>`).join('') + `</div>`
    : `<p class="muted">Nothing assigned yet.</p>`;

  main.innerHTML = html;
  $('#marg').onchange = e => { S.marginal = e.target.checked; render(); };
}
function idleReason(evs, t){
  if (!evs.length) return 'There are no unassigned students.';
  if (!evs.some(e => e.mins > 0)) return "No unassigned student's availability reaches these hours " +
    "(check whether the blocks land on a weekday in China).";
  if (!evs.some(e => e.mins > 0 && e.inLevel)) return 'Students do overlap on time, but none are in the ' +
    t.levelMin + '–' + t.levelMax + ' range.';
  return 'Blocked by another constraint.';
}

function render(){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.view === S.view));
  $('#week').value = S.weekSat;
  const w = weekMs(S.weekSat);
  const noon = d => pacificOffsetMin(wallToUtc(w + d * DAY + 12 * HOUR, 'PT'));
  const offFri = noon(-1), offSun = noon(1);
  const nm = o => o === -420 ? 'PDT' : 'PST';
  $('#tzinfo').innerHTML = offFri === offSun
    ? `Pacific is on ${nm(offFri)} (UTC${offFri/60}) this weekend · Beijing is UTC+8 · offset ${(480-offFri)/60} h`
    : `<b style="color:var(--warn)">Clocks change mid-weekend:</b> Pacific is ${nm(offFri)} (UTC${offFri/60}) on Fri/Sat ` +
      `and ${nm(offSun)} (UTC${offSun/60}) on Sun · Beijing is UTC+8 throughout · ` +
      `offset ${(480-offFri)/60} h then ${(480-offSun)/60} h`;
  ({tutors:viewTutors, students:viewStudents, matching:viewMatching}[S.view])();
}

/* ==========================================================================
   9. EVENTS
   ========================================================================== */
document.querySelectorAll('nav button').forEach(b =>
  b.onclick = () => { S.view = b.dataset.view; render(); });

$('#week').onchange = e => { S.weekSat = snapToSaturday(e.target.value); render(); };

main.addEventListener('change', e => {
  const el = e.target, card = el.closest('[data-id]');
  if (!card || !el.dataset.k) return;
  const rec = findRec(card.dataset.id); if (!rec) return;
  const k = el.dataset.k;
  if (el.dataset.bi !== undefined){
    const b = rec.avail[+el.dataset.bi];
    if (k === 'day') b.day = el.value;
    else b[k] = (k === 'end' && el.value === '23:59') ? 1440 : toMin(el.value);
  } else if (el.type === 'checkbox'){
    const set = new Set(rec[k]);
    el.checked ? set.add(el.value) : set.delete(el.value);
    rec[k] = FOCUS.filter(f => set.has(f));
  } else if (k === 'interests'){ rec.interests = splitList(el.value); }
  else if (k === 'tutorId'){ rec.tutorId = el.value || null; render(); return; }
  else if (['grade','maxStudents','priorLoad'].includes(k)){ rec[k] = Math.max(0, +el.value || 0); }
  else if (k === 'levelMin' || k === 'levelMax'){
    rec[k] = el.value;
    if (li(rec.levelMax) < li(rec.levelMin)) rec[k === 'levelMin' ? 'levelMax' : 'levelMin'] = el.value;
    render(); return;
  } else rec[k] = el.value;
  const d = card.querySelector('.dv');            // refresh only the converted-times block
  if (d) d.innerHTML = derivedLine(rec);
});

main.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const act = b.dataset.act, card = b.closest('[data-id]'), rec = card && findRec(card.dataset.id);
  if (act === 'add-tutor'){ S.tutors.unshift(newTutor()); render(); }
  else if (act === 'add-student'){ S.students.unshift(newStudent()); render(); }
  else if (act === 'del'){
    if (!confirm('Delete ' + (rec.name || 'this record') + '?')) return;
    if (rec.id[0] === 't'){ S.tutors = S.tutors.filter(t => t !== rec);
      S.students.forEach(s => { if (s.tutorId === rec.id) s.tutorId = null; }); }
    else S.students = S.students.filter(s => s !== rec);
    render();
  }
  else if (act === 'addblk'){ rec.avail.push({day:'sat', start:540, end:660}); render(); }
  else if (act === 'rmblk'){ rec.avail.splice(+b.dataset.bi, 1); render(); }
  else if (act === 'accept'){ findS(b.dataset.s).tutorId = b.dataset.t; render(); }
  else if (act === 'unassign'){ findS(b.dataset.s).tutorId = null; render(); }
  else if (act === 'csv-out-t') download('tutors.csv', tutorsCSV(), 'text/csv');
  else if (act === 'csv-out-s') download('students.csv', studentsCSV(), 'text/csv');
  else if (act === 'csv-in-t') pickFile(txt => { importTutorsCSV(txt); render(); },
    'Tutor CSV columns: name, grade, focus, levelMin, levelMax, availability, maxStudents, otherStudents, interests, notes\n' +
    'availability example: fri 17:00-21:00; sat 08:00-10:00   (US Pacific)');
  else if (act === 'csv-in-s') pickFile(txt => { importStudentsCSV(txt); render(); },
    'Student CSV columns: name, grade, level, goals, interests, availability, tutor, notes\n' +
    'availability example: sat 08:00-11:00; sun 09:00-12:00   (Beijing)');
});

/* ==========================================================================
   10. IMPORT / EXPORT  (no localStorage — the exported JSON is the save file)
   ========================================================================== */
function download(name, text, mime){
  const url = URL.createObjectURL(new Blob([text], {type:mime || 'text/plain'}));
  const a = document.createElement('a'); a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function modal(html){
  const m = $('#modal'); m.className = 'modal'; m.innerHTML = '<div>' + html + '</div>';
  m.onclick = e => { if (e.target === m || e.target.dataset.close !== undefined) m.className = 'modal hide'; };
  return m;
}
let pendingFile = null;
function pickFile(cb, hint){
  const m = modal(`<h3 style="margin-top:0">Import</h3>
    <pre class="sub" style="white-space:pre-wrap">${esc(hint || '')}</pre>
    <p><button id="pf">Choose file…</button> or paste below:</p>
    <textarea id="pt"></textarea>
    <p style="text-align:right"><button data-close>Cancel</button>
      <button id="pgo" class="primary">Import</button></p>`);
  pendingFile = txt => { m.className = 'modal hide'; try { cb(txt); } catch (err){ alert('Import failed: ' + err.message); } };
  m.querySelector('#pf').onclick = () => $('#filein').click();
  m.querySelector('#pgo').onclick = () => pendingFile($('#pt').value);
}
$('#filein').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { const cb = pendingFile; e.target.value = ''; if (cb) cb(String(r.result)); };
  r.readAsText(f);
};

$('#btnSample').onclick = () => { loadSample(); S.view = 'matching'; render(); };
$('#btnClear').onclick = () => { if (confirm('Clear all tutors and students from memory?')){
  S.tutors = []; S.students = []; render(); } };
$('#btnExport').onclick = () => {
  const json = JSON.stringify({version:1, weekSat:S.weekSat, tutors:S.tutors, students:S.students}, null, 2);
  const m = modal(`<h3 style="margin-top:0">Export JSON — this is your save file</h3>
    <textarea id="ex">${esc(json)}</textarea>
    <p style="text-align:right"><button data-close>Close</button>
      <button id="cp">Copy</button><button id="dl" class="primary">Download</button></p>`);
  m.querySelector('#dl').onclick = () => download('tutor-match.json', json, 'application/json');
  m.querySelector('#cp').onclick = () => { const t = m.querySelector('#ex'); t.select(); document.execCommand('copy'); };
};
$('#btnImport').onclick = () => pickFile(txt => {
  const d = JSON.parse(txt);
  S.tutors = (d.tutors || []).map(normTutor);
  S.students = (d.students || []).map(normStudent);
  if (d.weekSat) S.weekSat = d.weekSat;
  _uid = S.tutors.length + S.students.length + 1000;
  render();
}, 'Paste or choose a JSON file previously produced by Export JSON.');

function normTutor(t){
  return {id:t.id || uid('t'), name:t.name || '', grade:+t.grade || 0,
    focus:(t.focus || []).filter(f => FOCUS.includes(f)),
    levelMin:LEVELS.includes(t.levelMin) ? t.levelMin : 'beginner',
    levelMax:LEVELS.includes(t.levelMax) ? t.levelMax : 'advanced',
    avail:(t.avail || []).filter(b => DAYS.includes(b.day)),
    maxStudents:+t.maxStudents || 0, priorLoad:+t.priorLoad || 0,
    interests:splitList((t.interests || []).join(',')), notes:t.notes || ''};
}
function normStudent(s){
  return {id:s.id || uid('s'), name:s.name || '', grade:+s.grade || 0,
    level:LEVELS.includes(s.level) ? s.level : 'beginner',
    goals:(s.goals || []).filter(g => FOCUS.includes(g)),
    interests:splitList((s.interests || []).join(',')),
    avail:(s.avail || []).filter(b => DAYS.includes(b.day)),
    tutorId:s.tutorId || null, notes:s.notes || ''};
}
const T_COLS = ['name','grade','focus','levelMin','levelMax','availability','maxStudents','otherStudents','interests','notes'];
const S_COLS = ['name','grade','level','goals','interests','availability','tutor','notes'];
function rowsToObjs(text, cols){
  const rows = parseCSV(text);
  if (!rows.length) return [];
  const head = rows[0].map(h => h.trim().toLowerCase());
  const hasHeader = cols.some(c => head.includes(c.toLowerCase()));
  const idx = c => hasHeader ? head.indexOf(c.toLowerCase()) : cols.indexOf(c);
  return rows.slice(hasHeader ? 1 : 0).map(r => {
    const o = {}; cols.forEach(c => { const i = idx(c); o[c] = i >= 0 ? (r[i] || '').trim() : ''; });
    return o;
  });
}
function importTutorsCSV(text){
  const added = rowsToObjs(text, T_COLS).filter(o => o.name).map(o => normTutor({
    name:o.name, grade:+o.grade, focus:splitList(o.focus), levelMin:o.levelMin || 'beginner',
    levelMax:o.levelMax || 'advanced', avail:parseAvail(o.availability),
    maxStudents:+o.maxStudents || 1, priorLoad:+o.otherStudents || 0,
    interests:splitList(o.interests), notes:o.notes}));
  S.tutors = S.tutors.concat(added);
  alert('Imported ' + added.length + ' tutor(s).');
}
function importStudentsCSV(text){
  const byName = Object.fromEntries(S.tutors.map(t => [t.name.toLowerCase(), t.id]));
  const added = rowsToObjs(text, S_COLS).filter(o => o.name).map(o => normStudent({
    name:o.name, grade:+o.grade, level:o.level || 'beginner', goals:splitList(o.goals),
    interests:splitList(o.interests), avail:parseAvail(o.availability),
    tutorId:byName[(o.tutor || '').toLowerCase()] || null, notes:o.notes}));
  S.students = S.students.concat(added);
  alert('Imported ' + added.length + ' student(s).');
}
const tutorsCSV = () => toCSV([T_COLS].concat(S.tutors.map(t =>
  [t.name, t.grade, t.focus.join(';'), t.levelMin, t.levelMax, fmtAvail(t.avail),
   t.maxStudents, t.priorLoad, t.interests.join(';'), t.notes])));
const studentsCSV = () => toCSV([S_COLS].concat(S.students.map(s =>
  [s.name, s.grade, s.level, s.goals.join(';'), s.interests.join(';'), fmtAvail(s.avail),
   (findT(s.tutorId) || {}).name || '', s.notes])));

$('#btnPairCsv').onclick = () => {
  const ctx = buildCtx(S);
  const rows = [['student','grade','level','tutor','tutorGrade','weeklyOverlapHours',
                 'overlapBeijing','overlapPacific','sharedFocus','status']];
  for (const s of S.students){
    const t = findT(s.tutorId);
    if (!t){ rows.push([s.name, s.grade, s.level, '', '', 0, '', '', '', 'UNASSIGNED']); continue; }
    const e = evaluate(t, s, ctx);
    rows.push([s.name, s.grade, s.level, t.name, t.grade, hrs(e.mins),
      e.ov.map(iv => fmtRange(iv,'CN')).join('; '),
      e.ov.map(iv => fmtRange(iv,'PT') + ' ' + utcToWall(iv.s,'PT').abbr).join('; '),
      e.shFocus.join(';'),
      e.mins === 0 ? 'NO OVERLAP — REVIEW' : (!e.inLevel ? 'LEVEL MISMATCH — REVIEW' : 'ok')]);
  }
  download('pairings-' + S.weekSat + '.csv', toCSV(rows), 'text/csv');
};

/* ==========================================================================
   11. BOOT
   ========================================================================== */
(function boot(){
  S.weekSat = nextSaturday();
  const res = runTests(), passed = res.filter(r => r.ok).length;
  $('#testSum').innerHTML = `Self-tests: <b style="color:var(--${passed === res.length ? 'ok' : 'bad'})">` +
    `${passed}/${res.length} passing</b> — timezone, overlap and scoring assertions (click to expand)`;
  $('#testBody').innerHTML = '<ul>' + res.map(r => `<li class="${r.ok ? 'p' : 'f'}">` +
    `${r.ok ? '✓' : '✗'} ${esc(r.name)}${r.ok ? '' : ' — ' + esc(r.msg)}</li>`).join('') + '</ul>';
  if (passed !== res.length) $('#tests').open = true;
  render();
})();
</script>
