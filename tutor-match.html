<script>
"use strict";
/* ==========================================================================
   1. TIMEZONE CORE  — pure functions, no DOM.
   Tutors live in US Pacific (DST). Students live in Beijing (UTC+8, no DST).
   ========================================================================== */
const MIN = 60000, HOUR = 3600000, DAY = 86400000;
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_OFF = {fri:-1, sat:0, sun:1};      // days from the reference Saturday

// nth occurrence of `weekday` in a month, as UTC midnight ms.
function nthWeekdayUTC(year, monthIdx, weekday, n){
  const first = Date.UTC(year, monthIdx, 1);
  const firstWd = new Date(first).getUTCDay();
  return Date.UTC(year, monthIdx, 1 + ((weekday - firstWd + 7) % 7) + (n - 1) * 7);
}
// US DST begins 2nd Sunday of March at 02:00 local standard time = 10:00 UTC (Pacific).
const dstStartUTC = y => nthWeekdayUTC(y, 2, 0, 2) + 10 * HOUR;
// US DST ends 1st Sunday of November at 02:00 local daylight time = 09:00 UTC (Pacific).
const dstEndUTC   = y => nthWeekdayUTC(y, 10, 0, 1) + 9 * HOUR;

function pacificOffsetMin(utcMs){
  const y = new Date(utcMs).getUTCFullYear();
  return (utcMs >= dstStartUTC(y) && utcMs < dstEndUTC(y)) ? -420 : -480;
}
const ZONES = {
  PT: {name:'Pacific', std:-480, alt:-420, offsetAt:pacificOffsetMin,
       abbr:m => pacificOffsetMin(m) === -420 ? 'PDT' : 'PST'},
  CN: {name:'Beijing', std:480,  alt:480,  offsetAt:() => 480, abbr:() => 'CST'}
};

/* Convert a wall-clock instant (local fields expressed as if they were UTC) into a
   true UTC instant for `zone`.  Conventions at transitions:
     - spring-forward gap  (02:00–02:59 does not exist): shifted forward one hour
     - fall-back ambiguity (01:00–01:59 happens twice):  first (daylight) occurrence */
function wallToUtc(wallMs, zone){
  const z = ZONES[zone];
  if (z.std === z.alt) return wallMs - z.std * MIN;
  const Us = wallMs - z.std * MIN;            // candidate assuming standard time
  const Ua = wallMs - z.alt * MIN;            // candidate assuming daylight time (earlier)
  const o1 = z.offsetAt(Us), o2 = z.offsetAt(Ua);
  if (o1 === o2) return wallMs - o1 * MIN;                 // unambiguous
  if (o1 === z.std && o2 === z.alt) return Ua;             // ambiguous → first occurrence
  return Us;                                               // nonexistent → shift forward
}
function utcToWall(utcMs, zone){
  const off = ZONES[zone].offsetAt(utcMs);
  const d = new Date(utcMs + off * MIN);
  return {wd:d.getUTCDay(), h:d.getUTCHours(), m:d.getUTCMinutes(),
          abbr:ZONES[zone].abbr(utcMs), off};
}
const pad = n => String(n).padStart(2,'0');
const hm  = w => pad(w.h) + ':' + pad(w.m);
const fmtAt = (utcMs, zone) => { const w = utcToWall(utcMs, zone); return WD[w.wd] + ' ' + hm(w); };
function fmtRange(iv, zone){
  const a = utcToWall(iv.s, zone), b = utcToWall(iv.e, zone);
  return WD[a.wd] + ' ' + hm(a) + '–' + (b.wd !== a.wd ? WD[b.wd] + ' ' : '') + hm(b);
}
/* A block is {day, start, end} in minutes-from-local-midnight, in its own zone.
   weekSatMs is UTC-midnight of the reference Saturday. */
function blockToInterval(block, zone, weekSatMs){
  const base = weekSatMs + DAY_OFF[block.day] * DAY;
  return {s:wallToUtc(base + block.start * MIN, zone),
          e:wallToUtc(base + block.end   * MIN, zone)};
}
function mergeIntervals(list){
  const xs = list.slice().sort((a,b) => a.s - b.s), out = [];
  for (const iv of xs){
    const last = out[out.length - 1];
    if (last && iv.s <= last.e) last.e = Math.max(last.e, iv.e);
    else out.push({s:iv.s, e:iv.e});
  }
  return out;
}

/* ==========================================================================
   2. SESSION SLOT GRID
   Sessions are fixed 30-minute slots, 07:00–13:00 Beijing time, Sat and Sun.
   The grid is anchored in Beijing time because China has no DST, so slot IDs
   mean the same real time every week.  Only the Pacific *label* moves with US
   daylight saving — which is exactly what the tutor needs to see.
   ========================================================================== */
const SLOT_LEN = 30, SLOT_FROM = 7 * 60, SLOT_TO = 13 * 60;
const SLOT_DAYS = ['sat','sun'];                       // Beijing weekend days
const SLOTS = [];
for (const day of SLOT_DAYS)
  for (let m = SLOT_FROM; m < SLOT_TO; m += SLOT_LEN)
    SLOTS.push({id:day + '-' + pad(Math.floor(m/60)) + pad(m%60), day, start:m});
const SLOT_IDS = new Set(SLOTS.map(s => s.id));
const SLOT_BY_ID = Object.fromEntries(SLOTS.map(s => [s.id, s]));

const slotInterval = (slot, weekSatMs) =>
  blockToInterval({day:slot.day, start:slot.start, end:slot.start + SLOT_LEN}, 'CN', weekSatMs);

/** Selected slot ids → merged UTC intervals (consecutive slots become one range). */
const slotsToIntervals = (ids, weekSatMs) =>
  mergeIntervals(ids.map(id => SLOT_BY_ID[id]).filter(Boolean).map(s => slotInterval(s, weekSatMs)));

/** Overlap is exact set intersection — no interval math can go wrong here. */
const sharedSlots = (a, b) => { const set = new Set(b); return a.filter(id => set.has(id)); };

const canonSlots = ids => { const set = new Set(ids); return SLOTS.filter(s => set.has(s.id)).map(s => s.id); };
const hrs = m => (m / 60).toFixed(1).replace(/\.0$/, '');
const slotHours = ids => hrs(ids.length * SLOT_LEN);

/** Expand "sat 08:00-11:00; sun 09:00-10:30" into slot ids (used by the sample roster). */
function parseSlots(str){
  const out = [];
  for (const part of String(str || '').split(';')){
    const m = /^\s*(sat|sun)\s+(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})\s*$/i.exec(part);
    if (!m) continue;
    const a = toMin(m[2]), b = toMin(m[3]);
    for (const s of SLOTS)
      if (s.day === m[1].toLowerCase() && s.start >= a && s.start + SLOT_LEN <= b) out.push(s.id);
  }
  return canonSlots(out);
}
const fmtSlots = (ids, zone, weekSatMs) =>
  slotsToIntervals(ids, weekSatMs).map(iv => fmtRange(iv, zone)).join('; ') || 'nothing selected';

/* The one genuinely awkward case the grid can produce: in winter the earliest
   Beijing slot lands at 15:00 Pacific on a Friday, i.e. during US school hours. */
function awkward(ivs){
  const notes = [];
  for (const iv of ivs){
    const a = utcToWall(iv.s,'PT'), b = utcToWall(iv.e,'PT');
    if (a.wd === 5 && a.h < 16) notes.push('starts ' + hm(a) + ' Friday Pacific — likely still a school day for the tutor');
    if (b.h >= 22 || (b.h === 0 && b.m > 0)) notes.push('runs to ' + hm(b) + ' Pacific — late for the tutor');
  }
  return [...new Set(notes)];
}

/* ==========================================================================
   3. MATCHING  — pure given (tutor, student, ctx)
   ========================================================================== */
const LEVELS = ['beginner','intermediate','advanced'];
const FOCUS  = ['conversation','reading','writing','test prep','pronunciation','vocabulary','presentation'];
const li = l => LEVELS.indexOf(l);

function buildCtx(state){
  const load = {};
  for (const t of state.tutors) load[t.id] = t.priorLoad;
  for (const s of state.students) if (s.tutorId && load[s.tutorId] !== undefined) load[s.tutorId]++;
  return {load, weekSatMs:weekMs(state.weekSat)};
}

/** Full evaluation: score breakdown, blockers, reasons, weaknesses. */
function evaluate(tutor, student, ctx){
  const load = ctx.load[tutor.id] ?? 0;
  const remaining = tutor.maxStudents - load;
  const shared = sharedSlots(tutor.avail, student.avail);
  const ov = slotsToIntervals(shared, ctx.weekSatMs);
  const mins = shared.length * SLOT_LEN;
  const inLevel = li(student.level) >= li(tutor.levelMin) && li(student.level) <= li(tutor.levelMax);
  const shFocus = tutor.focus.filter(f => student.goals.includes(f));
  const shInt   = tutor.interests.filter(i => student.interests.includes(i));

  const blockers = [];
  if (!shared.length)  blockers.push('schedule');
  if (remaining <= 0)  blockers.push('capacity');
  if (!inLevel)        blockers.push('level');

  const width = li(tutor.levelMax) - li(tutor.levelMin) + 1;
  const parts = {
    schedule:  35 * Math.min(1, shared.length / 4),      // 4 slots (2 h) of mutual time = full marks
    subject:   25 * Math.min(1, shFocus.length / Math.max(1, Math.min(tutor.focus.length, student.goals.length))),
    level:     inLevel ? 14 + 6 * (1 - (width - 1) / 2) : 0,
    interests: 10 * Math.min(1, shInt.length / 2),
    capacity:  remaining > 0 ? 10 * (1 - load / Math.max(1, tutor.maxStudents)) : 0
  };
  const score = Math.round(Object.values(parts).reduce((a,b) => a + b, 0));

  // ---- plain-English reasoning ----
  const why = [], weak = [];
  if (shared.length)
    why.push(shared.length + ' shared 30-min slot' + (shared.length > 1 ? 's' : '') +
             ' (' + slotHours(shared) + ' h): ' +
             ov.map(iv => fmtRange(iv,'CN') + ' Beijing · ' + fmtRange(iv,'PT') + ' ' + utcToWall(iv.s,'PT').abbr).join(' | '));
  if (shFocus.length) why.push('Both listed: ' + shFocus.join(', '));
  if (inLevel) why.push('Student is ' + student.level + '; tutor covers ' +
             (tutor.levelMin === tutor.levelMax ? tutor.levelMin + ' only' : tutor.levelMin + '–' + tutor.levelMax) +
             (width === 1 ? ' (specialist)' : ''));
  if (shInt.length) why.push('Shared interests: ' + shInt.join(', '));
  if (remaining > 0) why.push('Tutor has ' + remaining + ' of ' + tutor.maxStudents + ' slot' +
             (tutor.maxStudents > 1 ? 's' : '') + ' open' + (load ? ' (' + load + ' already assigned)' : ''));

  if (!shared.length) weak.push('No shared session slot at all — cannot be paired.');
  else {
    if (shared.length === 1) weak.push('Only one shared slot — no fallback if either side cancels that week.');
    awkward(ov).forEach(n => weak.push('Session ' + n + '.'));
  }
  if (!shFocus.length) weak.push('No overlap between tutor focus areas and student goals.');
  if (!shInt.length)   weak.push('No shared outside interests listed.');
  if (!inLevel) weak.push('Level mismatch: student is ' + student.level + ', tutor covers ' +
             tutor.levelMin + '–' + tutor.levelMax + '.');
  if (remaining === 1) weak.push("This is the tutor's last open slot.");
  if (remaining <= 0)  weak.push('Tutor is at capacity (' + load + '/' + tutor.maxStudents + ').');

  return {tutor, student, score, parts, ov, shared, mins, inLevel, remaining, load,
          shFocus, shInt, blockers, viable:blockers.length === 0,
          marginal:blockers.length === 1 && blockers[0] === 'level', why, weak};
}

/** Ranked candidates for one student. `marginal` includes level-mismatched tutors. */
function rank(student, state, ctx, marginal){
  const evals = state.tutors.map(t => evaluate(t, student, ctx));
  const keep = evals.filter(e => e.viable || (marginal && e.marginal));
  keep.sort((a,b) => b.score - a.score || a.tutor.name.localeCompare(b.tutor.name));
  return {all:evals, top:keep};
}

/** Why does this student have nothing? Reports the first gate that everyone fails. */
function blockReason(evals){
  if (!evals.length) return 'There are no tutors in the roster.';
  const withOverlap = evals.filter(e => e.shared.length);
  if (!withOverlap.length)
    return 'No tutor has selected any of the same session slots.';
  const levelOk = withOverlap.filter(e => e.inLevel);
  if (!levelOk.length)
    return withOverlap.length + ' tutor(s) share a slot, but none cover the ' +
           evals[0].student.level + ' level.';
  if (!levelOk.filter(e => e.remaining > 0).length)
    return levelOk.length + ' tutor(s) fit on time and level, but all of them are at capacity.';
  return 'No blocker found.';
}
function idleReason(evs, t){
  if (!evs.length) return 'There are no unassigned students.';
  if (!evs.some(e => e.shared.length)) return 'No unassigned student has selected any of the same slots.';
  if (!evs.some(e => e.shared.length && e.inLevel))
    return 'Students share slots, but none are in the ' + t.levelMin + '–' + t.levelMax + ' range.';
  return 'Blocked by another constraint.';
}

/* ==========================================================================
   4. SELF-TESTS
   ========================================================================== */
const TESTS = [];
const test = (name, fn) => TESTS.push({name, fn});
function eq(actual, expected, label){
  const a = JSON.stringify(actual), b = JSON.stringify(expected);
  if (a !== b) throw new Error((label ? label + ': ' : '') + 'expected ' + b + ', got ' + a);
}
const weekMs = iso => Date.parse(iso + 'T00:00:00Z');
const B = (day, start, end) => ({day, start:toMin(start), end:toMin(end)});

// ---- timezone core ----
test('Pacific is PST (UTC−8) in January', () => eq(pacificOffsetMin(Date.UTC(2026,0,17,20)), -480));
test('Pacific is PDT (UTC−7) in August',  () => eq(pacificOffsetMin(Date.UTC(2026,7,1,20)),  -420));
test('Spring-forward boundary is 2026-03-08 10:00Z', () => {
  eq(pacificOffsetMin(Date.UTC(2026,2,8,9,59)), -480, 'before');
  eq(pacificOffsetMin(Date.UTC(2026,2,8,10,0)), -420, 'after');
});
test('Fall-back boundary is 2026-11-01 09:00Z', () => {
  eq(pacificOffsetMin(Date.UTC(2026,10,1,8,59)), -420, 'before');
  eq(pacificOffsetMin(Date.UTC(2026,10,1,9,0)),  -480, 'after');
});
test('Beijing is UTC+8 year-round (no DST)', () => {
  eq(ZONES.CN.offsetAt(Date.UTC(2026,0,1)), 480);
  eq(ZONES.CN.offsetAt(Date.UTC(2026,6,1)), 480);
});
test('Spring-forward: Pacific Sun 01:00–04:00 is only 2 real hours', () => {
  const iv = blockToInterval(B('sun','01:00','04:00'), 'PT', weekMs('2026-03-07'));
  eq((iv.e - iv.s) / MIN, 120);
});
test('Fall-back: Pacific Sun 01:00–04:00 is 4 real hours', () => {
  const iv = blockToInterval(B('sun','01:00','04:00'), 'PT', weekMs('2026-10-31'));
  eq((iv.e - iv.s) / MIN, 240);
});
test('Nonexistent 02:30 PT on spring-forward day shifts to 03:30 PDT', () => {
  eq(fmtAt(wallToUtc(Date.UTC(2026,2,8,2,30), 'PT'), 'PT'), 'Sun 03:30');
});
test('Ambiguous 01:30 PT on fall-back day resolves to the first (PDT) pass', () => {
  eq(wallToUtc(Date.UTC(2026,10,1,1,30), 'PT'), Date.UTC(2026,10,1,8,30));
});
test('Merging: adjacent intervals collapse into one', () => {
  eq(mergeIntervals([{s:0,e:100},{s:100,e:200},{s:400,e:500}]), [{s:0,e:200},{s:400,e:500}]);
});

// ---- session slot grid ----
test('Grid is 24 slots: 12 per day × Sat and Sun', () => {
  eq(SLOTS.length, 24);
  eq(SLOTS.filter(s => s.day === 'sat').length, 12);
});
test('Grid runs 07:00 to 13:00 Beijing, last slot 12:30–13:00', () => {
  const sat = SLOTS.filter(s => s.day === 'sat'), w = weekMs('2026-08-01');
  eq(fmtRange(slotInterval(sat[0], w), 'CN'), 'Sat 07:00–07:30', 'first');
  eq(fmtRange(slotInterval(sat[11], w), 'CN'), 'Sat 12:30–13:00', 'last');
});
test('Date line: the Beijing Sat 07:00 slot is Pacific Fri 16:00 in summer', () => {
  eq(fmtRange(slotInterval(SLOT_BY_ID['sat-0700'], weekMs('2026-08-01')), 'PT'), 'Fri 16:00–16:30');
});
test('…and Pacific Fri 15:00 in winter — an hour earlier, still Friday', () => {
  eq(fmtRange(slotInterval(SLOT_BY_ID['sat-0700'], weekMs('2026-01-17')), 'PT'), 'Fri 15:00–15:30');
});
test('Every slot lands on Fri or Sat in Pacific, never the same weekday as Beijing', () => {
  for (const wk of ['2026-08-01','2026-01-17']) for (const s of SLOTS){
    const iv = slotInterval(s, weekMs(wk));
    const p = utcToWall(iv.s,'PT').wd, c = utcToWall(iv.s,'CN').wd;
    if (p === c) throw new Error(s.id + ' on ' + wk + ' has the same weekday in both zones');
    if (p !== 5 && p !== 6) throw new Error(s.id + ' on ' + wk + ' is Pacific ' + WD[p]);
  }
});
test('Consecutive slots merge into one displayed range', () => {
  const ivs = slotsToIntervals(['sat-0800','sat-0830','sat-0900'], weekMs('2026-08-01'));
  eq(ivs.length, 1);
  eq(fmtRange(ivs[0],'CN'), 'Sat 08:00–09:30');
});
test('Non-consecutive slots stay separate', () => {
  eq(slotsToIntervals(['sat-0800','sat-1200'], weekMs('2026-08-01')).length, 2);
});
test('Overlap is exact slot-set intersection', () => {
  eq(sharedSlots(['sat-0800','sat-0830','sun-0900'], ['sat-0830','sun-0900','sun-1000']),
     ['sat-0830','sun-0900']);

function nextSaturday(){
  const now = new Date();
  const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
  d.setUTCDate(d.getUTCDate() + ((6 - d.getUTCDay() + 7) % 7));
  return d.toISOString().slice(0,10);
}
function snapToSaturday(iso){            // nearest Saturday; a Friday belongs to the weekend ahead
  const ms = weekMs(iso);
  if (isNaN(ms)) return S.weekSat;
  const d = new Date(ms), wd = d.getUTCDay();
  const back = (wd + 1) % 7, fwd = (6 - wd + 7) % 7;
  d.setUTCDate(d.getUTCDate() + (fwd <= back ? fwd : -back));
  return d.toISOString().slice(0,10);
}

function slotPicker(rec){
  const isT = rec.id[0] === 't', zone = isT ? 'PT' : 'CN', w = weekMs(S.weekSat);
  const sel = new Set(rec.avail);
  return '<div class="slots">' + SLOT_DAYS.map(day => {
    const ds = SLOTS.filter(s => s.day === day);
    const span = {s:slotInterval(ds[0], w).s, e:slotInterval(ds[ds.length-1], w).e};
    const head = isT
      ? `${fmtRange(span,'PT')} ${utcToWall(span.s,'PT').abbr} <span class="muted">= ${WD[utcToWall(span.s,'CN').wd]} Beijing</span>`
      : `${fmtRange(span,'CN')} <span class="muted">= ${WD[utcToWall(span.s,'PT').wd]} Pacific</span>`;
    return `<div class="slotcol"><h4>${head}
        <button data-act="slotall" data-day="${day}" class="mini">all</button>
        <button data-act="slotnone" data-day="${day}" class="mini">none</button></h4>` +
      ds.map(s => {
        const iv = slotInterval(s, w);
        return `<label><input type="checkbox" data-k="avail" value="${s.id}"${sel.has(s.id) ? ' checked' : ''}>` +
               `${hm(utcToWall(iv.s, zone))}–${hm(utcToWall(iv.e, zone))}</label>`;

function candidateHTML(e, idx, contention){
  const weak = e.weak.slice();
  if (contention > 0 && contention + 1 > e.remaining)
    weak.push(contention + ' other unassigned student' + (contention > 1 ? 's' : '') +
      ' also rank' + (contention > 1 ? '' : 's') + ' this tutor first, but only ' +
      e.remaining + ' slot' + (e.remaining === 1 ? ' remains' : 's remain') + '.');
  return `<div class="cand${idx === 0 ? ' top' : ''}">
    <div class="hd"><h2>${idx + 1}. ${esc(e.tutor.name)} <span class="muted">grade ${e.tutor.grade}</span>
      ${e.marginal ? '<span class="pill bad">out of level</span>' : ''}</h2>
      <div><span class="score">${e.score}</span><span class="muted">/100</span>
        <button data-act="accept" data-s="${e.student.id}" data-t="${e.tutor.id}" class="primary">Accept</button></div></div>
    <ul class="why">${e.why.map(r => `<li>${esc(r)}</li>`).join('')}
      ${weak.map(r => `<li class="w">${esc(r)}</li>`).join('')}</ul>
    <div class="sub" style="margin-top:5px">schedule ${e.parts.schedule.toFixed(0)} ·
      subject ${e.parts.subject.toFixed(0)} · level ${e.parts.level.toFixed(0)} ·
      interests ${e.parts.interests.toFixed(0)} · capacity ${e.parts.capacity.toFixed(0)}</div></div>`;
}

function viewMatching(){
  if (!S.tutors.length && !S.students.length){
    main.innerHTML = `<div class="card"><p>No roster loaded.</p>
      <p class="muted">Click <b>Load sample data</b> above for a demo roster, or import a JSON save file,
      or add records in the Tutors / Students views.</p></div>`;
    return;
  }
  const ctx = buildCtx(S);
  const unassigned = S.students.filter(s => !s.tutorId);
  const ranked = unassigned.map(s => ({student:s, ...rank(s, S, ctx, S.marginal)}));

  const firstCount = {};
  ranked.forEach(r => { const t = r.top[0]; if (t) firstCount[t.tutor.id] = (firstCount[t.tutor.id] || 0) + 1; });

  const stuck = ranked.filter(r => !r.top.length);
  const idle = S.tutors.filter(t => t.maxStudents - ctx.load[t.id] > 0).map(t => {
    const evs = unassigned.map(s => evaluate(t, s, ctx));
    return {t, evs, any:evs.some(e => e.viable)};
  }).filter(x => !x.any);
  const broken = S.students.filter(s => s.tutorId).map(s => {
    const t = findT(s.tutorId);
    if (!t) return {s, t:null, msg:'Assigned tutor is no longer in the roster.'};
    const e = evaluate(t, s, ctx);
    if (!e.shared.length) return {s, t, msg:'They no longer share any session slot.'};
    if (!e.inLevel) return {s, t, msg:'Student is ' + s.level + ' but tutor now covers ' + t.levelMin + '–' + t.levelMax + '.'};
    return null;
  }).filter(Boolean);
  const healthy = S.students.filter(s => s.tutorId && !broken.some(b => b.s.id === s.id))
    .map(s => ({s, t:findT(s.tutorId), e:evaluate(findT(s.tutorId), s, ctx)}));

  let html = `<div class="hd"><h2>Matching</h2>
      <label style="flex-direction:row;align-items:center;gap:5px"><input type="checkbox" id="marg"${S.marginal ? ' checked' : ''}>
        include out-of-level tutors as marginal suggestions</label></div>
    <p class="sub">Sessions are 30 minutes, 07:00–13:00 Beijing on Sat and Sun.
      Existing pairings are preserved; suggestions cover the
      ${unassigned.length} unassigned student${unassigned.length === 1 ? '' : 's'}, and
      accepting one re-ranks the rest.</p>`;

  const probs = stuck.length + idle.length + broken.length;
  html += `<h3>Needs your attention ${probs ? `<span class="pill bad">${probs}</span>` : `<span class="pill ok">none</span>`}</h3>`;
  for (const r of stuck)
    html += `<div class="prob bad"><b>${esc(r.student.name)}</b> (${esc(r.student.level)}, grade ${r.student.grade})
      has no viable tutor. ${esc(blockReason(r.all))}
      <div class="sub">Free ${esc(fmtSlots(r.student.avail,'CN',ctx.weekSatMs))} Beijing
        = ${esc(fmtSlots(r.student.avail,'PT',ctx.weekSatMs))} Pacific.</div></div>`;
  for (const x of idle)
    html += `<div class="prob"><b>${esc(x.t.name)}</b> has ${x.t.maxStudents - ctx.load[x.t.id]} open slot(s)
      but no viable unassigned student. ${esc(idleReason(x.evs, x.t))}
      <div class="sub">Free ${esc(fmtSlots(x.t.avail,'PT',ctx.weekSatMs))} Pacific
        = ${esc(fmtSlots(x.t.avail,'CN',ctx.weekSatMs))} Beijing.</div></div>`;
  for (const b of broken)
    html += `<div class="prob bad">Existing pair <b>${esc(b.s.name)}</b> ↔ <b>${b.t ? esc(b.t.name) : '?'}</b> is no longer viable.
      ${esc(b.msg)} <button data-act="unassign" data-s="${b.s.id}">Unassign</button></div>`;
  if (!probs) html += `<p class="muted">No unmatched students, no idle tutors, no broken pairs.</p>`;

  html += `<h3>Suggestions for unassigned students</h3>`;
  const withCands = ranked.filter(r => r.top.length);
  html += withCands.length ? withCands.map(r => `<div class="card">
      <div class="hd"><h2>${esc(r.student.name)} <span class="muted">grade ${r.student.grade} ·
        ${esc(r.student.level)} · ${esc(r.student.goals.join(', ') || 'no goals listed')}</span></h2>
        <span class="sub">${r.top.length} viable tutor${r.top.length === 1 ? '' : 's'}</span></div>
      <div class="sub">Free ${esc(fmtSlots(r.student.avail,'CN',ctx.weekSatMs))} Beijing${r.student.notes ? ' · ' + esc(r.student.notes) : ''}</div>
      ${r.top.slice(0,3).map((e, i) => candidateHTML(e, i, i === 0 ? (firstCount[e.tutor.id] || 1) - 1 : 0)).join('')}
    </div>`).join('') : `<p class="muted">No unassigned students with viable tutors.</p>`;

  html += `<h3>Current pairings (${healthy.length} healthy)</h3>`;
  html += healthy.length ? `<div class="card">` + healthy.map(p => `<div style="padding:4px 0;border-bottom:1px solid var(--line)">
      <b>${esc(p.s.name)}</b> ↔ <b>${esc(p.t.name)}</b>
      <span class="pill ok">${p.e.shared.length} slot${p.e.shared.length > 1 ? 's' : ''} · ${slotHours(p.e.shared)} h/wk</span>
      <button data-act="unassign" data-s="${p.s.id}">Unassign</button>
      <div class="sub">${esc(p.e.ov.map(iv => fmtRange(iv,'CN') + ' Beijing · ' + fmtRange(iv,'PT') + ' ' + utcToWall(iv.s,'PT').abbr).join(' | '))}</div></div>`).join('') + `</div>`
    : `<p class="muted">Nothing assigned yet.</p>`;

  main.innerHTML = html;
  $('#marg').onchange = e => { S.marginal = e.target.checked; render(); };
}

function render(){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.view === S.view));
  $('#week').value = S.weekSat;
  const w = weekMs(S.weekSat);
  const noon = d => pacificOffsetMin(wallToUtc(w + d * DAY + 12 * HOUR, 'PT'));
  const offSat = noon(0), offSun = noon(1);
  const nm = o => o === -420 ? 'PDT' : 'PST';
  $('#tzinfo').innerHTML = offSat === offSun
    ? `Pacific is on ${nm(offSat)} (UTC${offSat/60}) this weekend · Beijing is UTC+8 · offset ${(480-offSat)/60} h`
    : `<b style="color:var(--warn)">Clocks change mid-weekend:</b> Pacific is ${nm(offSat)} (UTC${offSat/60}) Saturday ` +
      `and ${nm(offSun)} (UTC${offSun/60}) Sunday · Beijing is UTC+8 throughout`;
  ({tutors:viewTutors, students:viewStudents, matching:viewMatching}[S.view])();
}

/* ==========================================================================
   9. EVENTS
   ========================================================================== */
document.querySelectorAll('nav button').forEach(b =>
  b.onclick = () => { S.view = b.dataset.view; render(); });
$('#week').onchange = e => { S.weekSat = snapToSaturday(e.target.value); render(); };

main.addEventListener('change', e => {
  const el = e.target, card = el.closest('[data-id]');
  if (!card || !el.dataset.k) return;
  const rec = findRec(card.dataset.id); if (!rec) return;
  const k = el.dataset.k;
  if (el.type === 'checkbox'){
    const set = new Set(rec[k]);
    el.checked ? set.add(el.value) : set.delete(el.value);
    rec[k] = k === 'avail' ? canonSlots(set) : FOCUS.filter(f => set.has(f));
  }
  else if (k === 'interests'){ rec.interests = splitList(el.value); }
  else if (k === 'tutorId'){ rec.tutorId = el.value || null; render(); return; }
  else if (['grade','maxStudents','priorLoad'].includes(k)){ rec[k] = Math.max(0, +el.value || 0); }
  else if (k === 'levelMin' || k === 'levelMax'){
    rec[k] = el.value;
    if (li(rec.levelMax) < li(rec.levelMin)) rec[k === 'levelMin' ? 'levelMax' : 'levelMin'] = el.value;
    render(); return;
  } else rec[k] = el.value;
  const d = card.querySelector('.dv');
  if (d) d.innerHTML = derivedLine(rec);
});

main.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const act = b.dataset.act, card = b.closest('[data-id]'), rec = card && findRec(card.dataset.id);
  if (act === 'add-tutor'){ S.tutors.unshift(newTutor()); render(); }
  else if (act === 'add-student'){ S.students.unshift(newStudent()); render(); }
  else if (act === 'del'){
    if (!confirm('Delete ' + (rec.name || 'this record') + '?')) return;
    if (rec.id[0] === 't'){ S.tutors = S.tutors.filter(t => t !== rec);
      S.students.forEach(s => { if (s.tutorId === rec.id) s.tutorId = null; }); }
    else S.students = S.students.filter(s => s !== rec);
    render();
  }
  else if (act === 'slotall' || act === 'slotnone'){
    const day = b.dataset.day, ids = SLOTS.filter(s => s.day === day).map(s => s.id);
    const set = new Set(rec.avail);
    ids.forEach(id => act === 'slotall' ? set.add(id) : set.delete(id));
    rec.avail = canonSlots(set);
    card.querySelectorAll('input[data-k="avail"]').forEach(i => i.checked = set.has(i.value));
    card.querySelector('.dv').innerHTML = derivedLine(rec);
  }
  else if (act === 'accept'){ findS(b.dataset.s).tutorId = b.dataset.t; render(); }
  else if (act === 'unassign'){ findS(b.dataset.s).tutorId = null; render(); }
});

/* ==========================================================================
   10. IMPORT / EXPORT  (no browser storage — the exported JSON is the save file)
   ========================================================================== */
function download(name, text, mime){
  const url = URL.createObjectURL(new Blob([text], {type:mime || 'text/plain'}));
  const a = document.createElement('a'); a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function modal(html){
  const m = $('#modal'); m.className = 'modal'; m.innerHTML = '<div>' + html + '</div>';
  m.onclick = e => { if (e.target === m || e.target.dataset.close !== undefined) m.className = 'modal hide'; };
  return m;
}
let pendingFile = null;
function pickFile(cb, hint){
  const m = modal(`<h3 style="margin-top:0">Import JSON</h3>
    <p class="sub">${esc(hint || '')}</p>
    <p><button id="pf">Choose file…</button> or paste below:</p>
    <textarea id="pt"></textarea>
    <p style="text-align:right"><button data-close>Cancel</button>
      <button id="pgo" class="primary">Import</button></p>`);
  pendingFile = txt => { m.className = 'modal hide'; try { cb(txt); } catch (err){ alert('Import failed: ' + err.message); } };
  m.querySelector('#pf').onclick = () => $('#filein').click();
  m.querySelector('#pgo').onclick = () => pendingFile($('#pt').value);
}
$('#filein').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { const cb = pendingFile; e.target.value = ''; if (cb) cb(String(r.result)); };
  r.readAsText(f);
};

$('#btnSample').onclick = () => { loadSample(); S.view = 'matching'; render(); };
$('#btnClear').onclick = () => { if (confirm('Clear all tutors and students from memory?')){
  S.tutors = []; S.students = []; render(); } };
$('#btnExport').onclick = () => {
  const json = JSON.stringify({version:2, weekSat:S.weekSat, tutors:S.tutors, students:S.students}, null, 2);
  const m = modal(`<h3 style="margin-top:0">Export JSON — this is your save file</h3>
    <textarea id="ex">${esc(json)}</textarea>
    <p style="text-align:right"><button data-close>Close</button>
      <button id="cp">Copy</button><button id="dl" class="primary">Download</button></p>`);
  m.querySelector('#dl').onclick = () => download('tutor-match.json', json, 'application/json');
  m.querySelector('#cp').onclick = () => { const t = m.querySelector('#ex'); t.select(); document.execCommand('copy'); };
};
$('#btnImport').onclick = () => pickFile(txt => {
  const d = JSON.parse(txt);
  S.tutors = (d.tutors || []).map(normTutor);
  S.students = (d.students || []).map(normStudent);
  if (d.weekSat) S.weekSat = d.weekSat;
  _uid = S.tutors.length + S.students.length + 1000;
  render();
}, 'Paste or choose a JSON file previously produced by Export JSON.');

const normAvail = a => canonSlots((Array.isArray(a) ? a : []).filter(x => SLOT_IDS.has(x)));
const normTutor = t => ({id:t.id || uid('t'), name:t.name || '', grade:+t.grade || 0,
  focus:(t.focus || []).filter(f => FOCUS.includes(f)),
  levelMin:LEVELS.includes(t.levelMin) ? t.levelMin : 'beginner',
  levelMax:LEVELS.includes(t.levelMax) ? t.levelMax : 'advanced',
  avail:normAvail(t.avail), maxStudents:+t.maxStudents || 0, priorLoad:+t.priorLoad || 0,
  interests:splitList((t.interests || []).join(',')), notes:t.notes || ''});
const normStudent = s => ({id:s.id || uid('s'), name:s.name || '', grade:+s.grade || 0,
  level:LEVELS.includes(s.level) ? s.level : 'beginner',
  goals:(s.goals || []).filter(g => FOCUS.includes(g)),
  interests:splitList((s.interests || []).join(',')),
  avail:normAvail(s.avail), tutorId:s.tutorId || null, notes:s.notes || ''});

/* ==========================================================================
   11. BOOT
   ========================================================================== */
(function boot(){
  S.weekSat = nextSaturday();
  const res = runTests(), passed = res.filter(r => r.ok).length;
  $('#testSum').innerHTML = `Self-tests: <b style="color:var(--${passed === res.length ? 'ok' : 'bad'})">` +
    `${passed}/${res.length} passing</b> — timezone, session-grid and scoring assertions (click to expand)`;
  $('#testBody').innerHTML = '<ul>' + res.map(r => `<li class="${r.ok ? 'p' : 'f'}">` +
    `${r.ok ? '✓' : '✗'} ${esc(r.name)}${r.ok ? '' : ' — ' + esc(r.msg)}</li>`).join('') + '</ul>';
  if (passed !== res.length) $('#tests').open = true;
  render();
})();
</script>
